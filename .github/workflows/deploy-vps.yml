name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            FRONTEND_ENV_FILE="frontend/.env.local"
            FRONTEND_ENV_BACKUP=""
            restore_frontend_env() {
              if [ -n "$FRONTEND_ENV_BACKUP" ] && [ -f "$FRONTEND_ENV_BACKUP" ]; then
                mv -f "$FRONTEND_ENV_BACKUP" "$FRONTEND_ENV_FILE"
              fi
            }
            trap restore_frontend_env 0
            if [ -f "$FRONTEND_ENV_FILE" ]; then
              FRONTEND_ENV_BACKUP="$(mktemp "${TMPDIR:-/tmp}/probx-frontend-env.XXXXXX")"
              cp "$FRONTEND_ENV_FILE" "$FRONTEND_ENV_BACKUP"
            fi
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            restore_frontend_env
            FRONTEND_ENV_BACKUP=""
            PROBX_PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}" \
            PROBX_DEPLOY_BRANCH="${{ github.ref_name }}" \
            PROBX_FRONTEND_PORT="${{ vars.PROBX_FRONTEND_PORT || 3001 }}" \
            PROBX_PM2_INDEXER_INTERVAL="${{ vars.PROBX_PM2_INDEXER_INTERVAL || '15s' }}" \
            PROBX_EXPECTED_API_URL="${{ vars.PROBX_EXPECTED_API_URL || 'https://api.probx.site' }}" \
            bash deploy/pm2-deploy.sh
